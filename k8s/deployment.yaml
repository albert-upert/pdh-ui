apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdh-ui
  namespace: digitaltwin
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pdh-ui
  template:
    metadata:
      labels:
        app: pdh-ui
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: pdh-ui
          image: pdh-ui:latest
          imagePullPolicy: Never
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "250m"
