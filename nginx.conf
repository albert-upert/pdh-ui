server {
    listen 4000;

    root /app/storybook-static;
    index index.html;

    # Match the dev server COOP fix: Vite 7 adds COOP same-origin by default;
    # our viteFinal override sets it to unsafe-none for the dev server.
    # Apply the same header here so the static build behaves identically.
    add_header Cross-Origin-Opener-Policy "unsafe-none" always;

    # Serve iframe.html directly — no clean-URL redirect that breaks L6 source matching
    location = /iframe.html {
        try_files /iframe.html =404;
    }

    location ~* \.(js|css|png|svg|ico|woff|woff2|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "unsafe-none" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
